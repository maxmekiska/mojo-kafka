# Real Kafka broker for `pixi run test-broker`.
#
#   pixi run broker-up      # start and wait for healthy
#   pixi run test-broker
#   pixi run broker-down    # stop and delete the volume
#
# The mock-broker suite (`pixi run test-mock`) needs none of this.
#
# KAFKA_VERSION overrides the image tag (default 3.7.0).

services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.7.0}
    container_name: mojo-kafka-broker
    ports:
      # Must stay 9092:9092. The image advertises localhost:9092, and clients
      # use the advertised address for produce/fetch — a different host port
      # bootstraps fine and then times out.
      - "9092:9092"
    healthcheck:
      # A port probe, not `kafka-topics.sh --list`. That spawns a JVM per
      # check, which on a slow machine outlives the timeout; Docker then
      # starts another every `interval`, the container never reports
      # healthy, and the JVM storm drowns out any benchmark sharing the
      # cores. Kafka opens 9092 only once request processing is enabled.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
