[workspace]
name = "mojo-kafka"
version = "0.2.0"
description = "Apache Kafka client for Mojo — librdkafka bindings"
authors = ["Dvir Arad <dvirarad@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
license = "Apache-2.0"

[tasks]
example-produce = "mojo run -I src examples/produce.mojo"
example-pipeline = "mojo run -I src examples/pipeline.mojo"
example-consume = "mojo run -I src examples/consume.mojo"
lint = "mojo format src/ examples/ tests/ integration/ benchmarks/"
package = "mkdir -p dist && mojo precompile src/kafka -o dist/kafka.mojoc"
test = "mojo run -I src tests/test_smoke.mojo"
test-mock = "mojo run -I src integration/test_mock.mojo"
test-broker = "mojo run -I src integration/test_broker.mojo"
broker-up = "docker compose -f integration/docker-compose.yml up -d --wait"
broker-down = "docker compose -f integration/docker-compose.yml down -v"

# The package is pure Mojo over a C library -- it does not use MAX, so the
# environment is just the compiler plus librdkafka.
[dependencies]
mojo = "==1.0.0"
librdkafka = ">=2.3.0,<3"

# The cross-client interop suite (integration/interop) needs Python and a
# mainstream Kafka client to test against. That is a heavier dependency set
# than the rest of the project, so it lives in its own environment and the
# default one stays just the compiler plus librdkafka.
#
#   pixi run -e interop test-interop
#
[feature.interop.dependencies]
python = ">=3.11,<3.14"

[feature.interop.pypi-dependencies]
# confluent-kafka is the client this package's API is measured against, and
# the independent end of every crossing cell in the matrix. It wraps the same
# librdkafka src/kafka/_ffi.mojo binds, through a binding layer that shares no
# code with ours -- which is the layer this package is, and where every bug
# the suite has caught has lived.
confluent-kafka = ">=2.3,<3"
pytest = ">=8,<9"

[feature.interop.tasks]
test-interop = "pytest integration/interop -q"
# Local only, like the Docker suites: needs a real broker and both clients.
bench = "python benchmarks/run.py"

[environments]
interop = ["interop"]
