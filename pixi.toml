[workspace]
name = "mojo-kafka"
version = "0.2.0"
description = "Apache Kafka client for Mojo — librdkafka bindings"
authors = ["Dvir Arad <dvirarad@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
license = "Apache-2.0"

[tasks]
example-producer = "mojo run -I src examples/producer_basic.mojo"
example-consumer = "mojo run -I src examples/consumer_basic.mojo"
example-ml = "mojo run -I src examples/ml_pipeline.mojo"
lint = "mojo format src/ examples/ tests/ integration/"
package = "mkdir -p dist && mojo precompile src/kafka -o dist/kafka.mojoc"
test = "mojo run -I src tests/test_smoke.mojo"
test-mock = "mojo run -I src integration/test_mock.mojo"
test-broker = "mojo run -I src integration/test_broker.mojo"
broker-up = "docker compose -f integration/docker-compose.yml up -d --wait"
broker-down = "docker compose -f integration/docker-compose.yml down -v"

# The package is pure Mojo over a C library -- it does not use MAX, so the
# environment is just the compiler plus librdkafka.
[dependencies]
mojo = "==1.0.0"
librdkafka = ">=2.3.0,<3"
