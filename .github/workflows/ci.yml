name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Resolve env
        run: pixi install

      - name: Mojo version
        run: pixi run -- mojo --version

      - name: Format check
        run: |
          pixi run lint
          if ! git diff --quiet; then
            echo "::error::Formatting drift — run 'pixi run lint' locally and commit."
            git --no-pager diff
            exit 1
          fi

  test:
    # The mock broker is in-process, so the full integration suite runs here
    # too — including on macOS, where GitHub-hosted runners have no Docker.
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Resolve env
        run: pixi install

      - name: Mojo version
        run: pixi run -- mojo --version

      - name: Build package
        run: pixi run package

      - name: Build examples
        run: |
          for f in examples/*.mojo; do
            echo "building $f"
            pixi run -- mojo build -I src "$f" -o "$RUNNER_TEMP/$(basename "$f" .mojo)"
          done

      - name: Smoke tests
        run: pixi run test

      - name: Integration tests (mock broker)
        run: pixi run test-mock

# The Docker-backed suites -- `test-broker` and `interop/` -- deliberately do
# not run here. Docker is a local tool in this project: it is how you exercise
# the Topic Admin API (which the mock does not implement), real metadata
# propagation timing, and interop against confluent-kafka, and how you
# benchmark. CI stays on what needs no daemon, which is why it also runs on
# macOS. See integration/README.md for what to run locally and when.
